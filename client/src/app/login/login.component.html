<div class="container mt-5" style="max-width: 400px;">
  <div class="card p-4 shadow">
    <h3 class="text-center">{{ isLoginMode ? 'Bejelentkezés' : 'Regisztráció' }}</h3>
    
    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group mb-3" *ngIf="!isLoginMode">
        <label>Felhasználónév</label>
        <input type="text" [(ngModel)]="username" name="username" class="form-control" placeholder="Hogy hívjanak?">
      </div>

      <div class="form-group mb-3">
        <label>Email cím</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" required>
      </div>

      <div class="form-group mb-3">
        <label>Jelszó</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        {{ isLoginMode ? 'Belépés' : 'Fiók létrehozása' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <button class="btn btn-link btn-sm" (click)="toggleMode()">
        {{ isLoginMode ? 'Nincs még fiókod? Regisztrálj!' : 'Van már fiókod? Jelentkezz be!' }}
      </button>
    </div>
  </div>
</div>
